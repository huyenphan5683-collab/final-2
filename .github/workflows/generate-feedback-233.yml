name: Generate Customer Feedback Data 2.3.3

on:
  workflow_dispatch:

jobs:
  generate-feedback:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl xlsxwriter numpy

      - name: Run script
        run: |
          python generate_customer_feedback_233.py
        env:
          INPUT_FILE: smartlog_service_master_2023_2025.xlsx
          OUTPUT_FILE: smartlog_service_master_2023_2025_feedback.xlsx
          SEED: 42

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartlog-feedback-233-output
          path: smartlog_service_master_2023_2025_feedback.xlsx
