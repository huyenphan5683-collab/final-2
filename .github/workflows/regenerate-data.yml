name: Regenerate Smartlog Data

on:
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl xlsxwriter numpy

      - name: Run regeneration script
        run: |
          python regenerate_smartlog_data.py
        env:
          INPUT_FILE: smartlog_service_master_2023_2025.xlsx
          OUTPUT_FILE: smartlog_service_master_2023_2025_regenerated.xlsx
          SEED: 42

      - name: Upload output file
        uses: actions/upload-artifact@v4
        with:
          name: smartlog-regenerated-output
          path: smartlog_service_master_2023_2025_regenerated.xlsx
